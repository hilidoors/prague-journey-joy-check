<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff3355"><title>תפריט בעברית · פראג 2026</title><style>:root{--bg:#fafafa;--card:#fff;--ink:#242124;--muted:#716d76;--primary:#ff3355;--line:#ece9ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 14px 90px}.hero{position:relative;min-height:260px;background:#25344d center/cover no-repeat;color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,#000b)}.hero>*{position:relative}.hero h1{text-shadow:0 2px 12px #000}.hero h1{margin:8px 0 4px;font-size:28px}.back{display:inline-block;color:#fff;text-decoration:none;border:1px solid #ffffff77;border-radius:999px;padding:9px 14px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 2px 8px #00000012}.waiter{background:#eaf8e9;border:2px solid #327338;color:#174d22}.waiter h2{margin:0 0 8px}.czech{direction:ltr;text-align:left;font-size:18px;font-weight:750;line-height:1.45}.dish{display:grid;grid-template-columns:1fr 50px;gap:10px;align-items:center}.he{font-size:19px;font-weight:850}.desc{color:var(--muted);margin:4px 0}.note{font-size:14px;font-weight:700;color:#287331;margin:2px 0 4px}.price{color:var(--primary);font-weight:800}.play{border:0;background:#e8f5eb;color:#176229;width:48px;height:48px;border-radius:50%;font-size:21px}.mainplay{border:0;background:#287331;color:white;border-radius:999px;padding:11px 16px;font-weight:800;margin-top:12px}.small{font-size:13px;color:var(--muted)}.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-inline-start:6px;vertical-align:middle;line-height:1.6}.badge-pork{background:#b71c1c;color:#fff}.badge-shell{background:#e67e22;color:#fff}.badge-rec{background:#f1c40f;color:#242124}.badge-must{background:#287331;color:#fff}.badge-sadlo{background:#5c1a1a;color:#fff}.badge-unknown{background:#6b5b00;color:#fff}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}.pill{padding:8px 14px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.pill.active{background:#287331;border-color:#287331;color:#fff}.filter-note{font-size:12px;color:var(--muted);margin:0 0 8px}</style><script src="restaurant-menus-v13.js"></script></head><body><main class="wrap" id="app"></main><audio id="audio" preload="none"></audio><script>const BADGES={pork:['badge-pork','⚠️ חזיר'],shell:['badge-shell','⚠️ סרטנים/רכיכות'],unknown:['badge-unknown','❓ לא ידוע — לשאול'],rec:['badge-rec','⭐ מומלץ'],must:['badge-must','⭐ חובה']};const badgesHtml=d=>((d.badges||[]).map(b=>BADGES[b]?`<span class="badge ${BADGES[b][0]}">${BADGES[b][1]}</span>`:'').join('')+(d.sadlo?`<span class="badge badge-sadlo">🚫 סאדלו</span>`:''));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('r'),m=window.RESTAURANT_MENUS&&window.RESTAURANT_MENUS[slug],waiter='Máme závažnou alergii na korýše a měkkýše. I malé množství nebo stopa může být nebezpečná. Prosíme, připravte naše jídlo odděleně a zabraňte křížové kontaminaci. Nepoužívejte stejné hrnce, pánve, náčiní, olej na smažení ani gril, které přišly do styku s korýši nebo měkkýši. Nejíme vepřové maso ani slaninu, škvarky, uzeniny nebo vepřové sádlo. Prosíme, ověřte složení a přípravu s kuchařem. Děkujeme.';function play(src,b){if(localStorage.getItem('shabbatMode')==='1')return alert('מצב שבת פעיל — שמע התפריטים מושבת');const a=document.querySelector('#audio');a.pause();a.src=src;a.play();document.querySelectorAll('.play,.mainplay').forEach(x=>x.textContent=x.classList.contains('play')?'🔊':'🔊 השמע בצ׳כית');b.textContent='⏹';a.onended=()=>b.textContent=b.classList.contains('play')?'🔊':'🔊 השמע בצ׳כית'}let currentFilter='all';
function setFilter(f){currentFilter=f;document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.dataset.f===f));const n=document.querySelector('#filterNote');n.textContent=f==='nopork'?'מסתיר חזיר, סאדלו ומנות שסומנו לא ידוע — לשאול; סינון שמרני.':f==='shell'?'מציג רק מנות שסומנו במפורש כסרטנים או רכיכות. דגים אינם מסומנים.':f==='rec'?'רק מנות בסיווג מומלץ או חובה.':'';applyFilter()}
function applyFilter(){const arts=[...document.querySelectorAll('#app article.dish')];arts.forEach(a=>{const b=a.dataset.badges||'',sd=a.dataset.sadlo==='1';if(currentFilter==='all'){a.style.display='';return}if(currentFilter==='rec'){a.style.display=/rec|must/.test(b)?'':'none';return}if(currentFilter==='shell'){a.style.display=b.includes('shell')?'':'none';return}a.style.display=(b.includes('pork')||b.includes('unknown')||sd)?'none':''});document.querySelectorAll('#app h2.section-title').forEach(h=>{let el=h.nextElementSibling,any=false;while(el&&!el.matches('h2.section-title')){if(el.matches('article.dish')&&el.style.display!=='none')any=true;el=el.nextElementSibling}h.style.display=any?'':'none'});let e=document.querySelector('#filterEmpty');const any=arts.some(a=>a.style.display!=='none');if(!any){if(!e){e=document.createElement('div');e.id='filterEmpty';e.className='card';e.textContent='אין מנות להצגה בסינון הנוכחי.';document.querySelector('#app').appendChild(e)}}else if(e)e.remove()}
document.querySelector('#app').innerHTML=m?`<header class="hero" style="background-image:url(${esc(m.hero)})"><a class="back" href="index.html">→ חזרה למסלול</a><div style="margin-top:18px">🍽️ תפריט בעברית</div><h1>${esc(m.name)}</h1><div>התפריט המלא לפי המקור הרשמי${m.sourceNote?` · ${esc(m.sourceNote)}`:""}</div></header><section class="card waiter"><h2>🛡️ להציג למלצר</h2><div class="czech" lang="cs">${waiter}</div><div class="small" style="margin-top:6px">בעברית: לשנינו אלרגיה חמורה לסרטנים ולרכיכות — גם עקבות מסוכנות; למנוע זיהום צולב, כולל שמן טיגון וגריל משותפים; בלי חזיר, בייקון, שומן חזיר מטוגן, נקניקים או סאדלו; לוודא רכיבים והכנה מול השף.</div><button class="mainplay" onclick="play('audio/menu/waiter-cs.mp3',this)">🔊 השמע בצ׳כית</button></section><div class="pills"><button class="pill active" data-f="all" onclick="setFilter('all')">הכל</button><button class="pill" data-f="rec" onclick="setFilter('rec')">⭐ מומלץ וחובה</button><button class="pill" data-f="nopork" onclick="setFilter('nopork')">🚫 בלי חזיר / לא ידוע</button><button class="pill" data-f="shell" onclick="setFilter('shell')">⚠️ סרטנים ורכיכות</button></div><div class="filter-note" id="filterNote"></div>${m.dishes.map((d,i)=>(i===0||d.section!==m.dishes[i-1].section?`<h2 class="section-title">${esc(d.section)}</h2>`:"")+`<article class="card dish" data-badges="${(d.badges||[]).join(' ')}" data-sadlo="${d.sadlo?1:0}"><div><div class="he">${esc(d.he)}${badgesHtml(d)}</div><div class="czech" lang="cs">${esc(d.cs)}</div><div class="desc">${esc(d.desc)}</div>${d.note?`<div class="note">${esc(d.note)}</div>`:''}<div class="price">${esc(d.price)}</div></div><button class="play" onclick="play('${d.audio}',this)" aria-label="השמע בצ׳כית">🔊</button></article>`).join('')}<p class="small">התפריט והמחירים עשויים להשתנות במסעדה. ההקלטה אומרת את שם המנה ומבקשת מנה אחת.</p>`:`<div class="card"><h1>התפריט לא נמצא</h1><a href="index.html">חזרה למסלול</a></div>`;applyFilter();</script><script>"serviceWorker" in navigator&&navigator.serviceWorker.register("sw.js")</script></body></html>
