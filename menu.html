<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff3355"><title>תפריט בעברית · פראג 2026</title><style>:root{--bg:#fafafa;--card:#fff;--ink:#242124;--muted:#716d76;--primary:#ff3355;--line:#ece9ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 14px 90px}.hero{position:relative;min-height:260px;background:#25344d center/cover no-repeat;color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,#000b)}.hero>*{position:relative}.hero h1{text-shadow:0 2px 12px #000}.hero h1{margin:8px 0 4px;font-size:28px}.back{display:inline-block;color:#fff;text-decoration:none;border:1px solid #ffffff77;border-radius:999px;padding:9px 14px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 2px 8px #00000012}.waiter{background:#eaf8e9;border:2px solid #327338;color:#174d22}.waiter h2{margin:0 0 8px}.czech{direction:ltr;text-align:left;font-size:18px;font-weight:750;line-height:1.45}.dish{display:grid;grid-template-columns:1fr 50px;gap:10px;align-items:center}.he{font-size:19px;font-weight:850}.desc{color:var(--muted);margin:4px 0}.price{color:var(--primary);font-weight:800}.play{border:0;background:#e8f5eb;color:#176229;width:48px;height:48px;border-radius:50%;font-size:21px}.mainplay{border:0;background:#287331;color:white;border-radius:999px;padding:11px 16px;font-weight:800;margin-top:12px}.small{font-size:13px;color:var(--muted)}</style><script src="restaurant-menus-v8.js"></script></head><body><main class="wrap" id="app"></main><audio id="audio" preload="none"></audio><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('r'),m=window.RESTAURANT_MENUS&&window.RESTAURANT_MENUS[slug],waiter='Jsem alergický na korýše a mořské plody a nejím vepřové maso. Prosím, ověřte to s kuchařem.';function play(src,b){const a=document.querySelector('#audio');a.pause();a.src=src;a.play();document.querySelectorAll('.play,.mainplay').forEach(x=>x.textContent=x.classList.contains('play')?'🔊':'🔊 השמע בצ׳כית');b.textContent='⏹';a.onended=()=>b.textContent=b.classList.contains('play')?'🔊':'🔊 השמע בצ׳כית'}document.querySelector('#app').innerHTML=m?`<header class="hero" style="background-image:url(${esc(m.hero)})"><a class="back" href="index.html">→ חזרה למסלול</a><div style="margin-top:18px">🍽️ תפריט בעברית</div><h1>${esc(m.name)}</h1><div>התפריט המלא לפי המקור הרשמי</div></header><section class="card waiter"><h2>🛡️ להציג למלצר</h2><div class="czech" lang="cs">${waiter}</div><button class="mainplay" onclick="play('audio/menu/waiter-cs.mp3',this)">🔊 השמע בצ׳כית</button></section>${m.dishes.map((d,i)=>(i===0||d.section!==m.dishes[i-1].section?`<h2 class="section-title">${esc(d.section)}</h2>`:"")+`<article class="card dish"><div><div class="he">${esc(d.he)}</div><div class="czech" lang="cs">${esc(d.cs)}</div><div class="desc">${esc(d.desc)}</div><div class="price">${esc(d.price)}</div></div><button class="play" onclick="play('${d.audio}',this)" aria-label="השמע בצ׳כית">🔊</button></article>`).join('')}<p class="small">התפריט והמחירים עשויים להשתנות במסעדה. ההקלטה אומרת את שם המנה ומבקשת מנה אחת.</p>`:`<div class="card"><h1>התפריט לא נמצא</h1><a href="index.html">חזרה למסלול</a></div>`;</script><script>"serviceWorker" in navigator&&navigator.serviceWorker.register("sw.js")</script></body></html>
